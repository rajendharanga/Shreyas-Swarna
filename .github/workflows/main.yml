
name: Build Shreyas Swarna Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build production website
        run: npm run build

      - name: Verify dist folder
        run: |
          test -f dist/index.html
          find dist -maxdepth 2 -type f | head -50

      - name: Create Hostinger ZIP
        run: |
          cd dist
          zip -r ../shreyas-swarna-dist.zip .

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: shreyas-swarna-dist
          path: shreyas-swarna-dist.zip
          if-no-files-found: error
          retention-days: 14
